name: CI and GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Generate TypeDoc reference
        run: npm run docs

      - name: Build static dashboard for Pages
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_DATA_MODE: static
        run: npm run build:pages

      - name: Attach quality reports to Pages artifact
        run: |
          touch out/.nojekyll
          mkdir -p out/reference out/coverage
          cp -R docs/reference/. out/reference/
          cp -R coverage/. out/coverage/
          cat > out/quality.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>SaaS Analytics Dashboard Quality Reports</title>
              <style>
                body { font-family: system-ui, sans-serif; margin: 3rem; line-height: 1.6; color: #0f172a; }
                a { color: #0e7490; font-weight: 700; }
              </style>
            </head>
            <body>
              <h1>Quality Reports</h1>
              <p><a href="./reference/">TypeDoc reference</a></p>
              <p><a href="./coverage/">Coverage report</a></p>
            </body>
          </html>
          HTML

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
